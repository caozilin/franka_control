[project]
name = "franka-control"
version = "0.1.0"
description = "Franka-focused robot control workspace with a Python high-level API and C++ libfranka backend."
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.19.0",
    "pygame>=2.0",
    "pynput>=1.8.2",
    "imageio[ffmpeg]>=2.0",
    "tyro>=0.1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=10.0",
    "msgpack-numpy>=0.4",
    "opencv-python>=4.0",
    "pyrealsense2>=2.0",
    "cmeel-tinyxml2==10.0.0",
    "cmeel-urdfdom==4.0.1",
    "pin==3.4.0",
]

[project.optional-dependencies]
build = [
    "cmake>=3.18,<4",
    "cmeel-urdfdom[build]==4.0.1",
    "pin[build]==3.4.0",
    "pybind11>=2.11,<4",
]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
