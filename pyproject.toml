[project]
name = "franka-control"
version = "0.1.0"
description = "Franka-focused robot control workspace with a Python high-level API and C++ libfranka backend."
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.19.0",
    "pygame>=2.0",
    "pynput>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

